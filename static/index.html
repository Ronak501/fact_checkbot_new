<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fact Check Bot</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Fact Check Bot</h1>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="avatar">B</div>
                <div class="message-content">
                    Hello! I'm your Fact Check Bot. Ask me anything to verify facts or get information.
                </div>
            </div>
        </div>
        <div class="typing-indicator" id="typing-indicator">
            Bot is typing...
        </div>
        <div class="input-container">
            <div class="input-wrapper">
                <input type="text" id="query" placeholder="Type your message here..." autocomplete="off">
                <button onclick="checkFact()" id="send-button">Send</button>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
